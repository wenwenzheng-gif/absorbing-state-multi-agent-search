name: Nano t1 Batch 2 validate preserve (HF deferred)
on:
  push:
    branches: [experiment/gpt54-nano-t1-none-batch2-seeds10-12]
    paths: [scripts/nano_t1/batch2/finalize_trigger.json]
permissions:
  contents: write
  actions: read
concurrency:
  group: nano-t1-batch2-finalize
  cancel-in-progress: false
jobs:
  validated-backup:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt -r requirements-agents.txt
      - name: Verify final source run, original sampling and new seed identities
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          marker=json.loads(Path("scripts/nano_t1/batch2/finalize_trigger.json").read_text())
          assert marker["family"]=="gpt-5.4-nano-t1"
          assert marker["model"]=="gpt-5.4-nano-2026-03-17"
          assert marker["seed_indices"]==[10,11,12]
          assert int(marker["source_run_id"])>0
          print("Verified final Batch 2 scientific source; no HF credential required.")
          PY
      - name: Re-verify all 171 episodes, 27 conditions, strict API model, original d_c analysis
        shell: bash
        run: |
          set -euo pipefail
          RID="$(python -c 'import json;print(json.load(open("scripts/nano_t1/batch2/finalize_trigger.json"))["source_run_id"])')"
          python scripts/nano_t1/batch2/finalize.py --source-run-id "$RID"
      - name: Persist validated Batch 2 archive in a durable GitHub release (no HF dependency)
        run: python scripts/nano_t1/batch2/preserve_batch2.py
      - name: Commit compact validation report to Batch 2 branch only
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/nano-t1-batch2/final_report.json
          git diff --cached --quiet || git commit -m "Finalize Nano t1 Batch 2 exact seeds 10-12 (HF pending)"
          git push origin HEAD:experiment/gpt54-nano-t1-none-batch2-seeds10-12
      - name: Preserve ZIP, validation and pending HF upload manifest (90-day secondary backup)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nano-t1-batch2-validated-${{ github.run_id }}
          path: |
            outputs/gpt-5.4-nano-t1-none-new3-batch2/summary/
            results/nano-t1-batch2/
          retention-days: 90
          if-no-files-found: warn
