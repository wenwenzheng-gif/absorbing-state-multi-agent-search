name: Nano t1 strict real API preflight
on:
  push:
    branches: [experiment/gpt54-nano-t1-none-new3]
    paths: [.github/workflows/nano-t1-preflight.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  exact-model:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      OPENAI_MODEL: gpt-5.4-nano-2026-03-17
      OPENAI_BASE_URL: https://api.openai.com/v1
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Restore independently verified original t1 provenance report
        run: gh run download 42508586474 --repo "${{ github.repository }}" --name nano-t1-audit-42508586474 --dir outputs/gpt-5.4-nano-t1-none-new3/
      - name: Check FINAL outgoing real API request with exact dated model + temperature + no reasoning
        run: python scripts/nano_t1/preflight.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nano-t1-exact-api-${{ github.run_id }}
          path: outputs/gpt-5.4-nano-t1-none-new3/preflight.json
          retention-days: 30
          if-no-files-found: warn
