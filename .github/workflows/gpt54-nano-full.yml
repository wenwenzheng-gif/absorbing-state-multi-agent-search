name: GPT-5.4 Nano experiment PAUSED
# User requested that the experiment stop; do not run model requests.
on:
  push:
    branches: [experiment/gpt54-nano-3tasks-6seeds-parallel]
    paths: [.github/workflows/gpt54-nano-full.yml]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # Same group as the formerly running experiment.
  # This replacement run cancels the already-active 18-seed run.
  group: gpt54-nano-full
  cancel-in-progress: true
jobs:
  paused:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: echo 'GPT-5.4 Nano experiment paused by user request; no model requests run.'
