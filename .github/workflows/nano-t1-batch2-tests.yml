name: Nano t1 Batch 2 offline consistency and packaging tests
on:
  push:
    branches: [experiment/gpt54-nano-t1-none-batch2-seeds10-12]
    paths: [.github/workflows/nano-t1-batch2-tests.yml]
permissions:
  contents: read
jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile all Batch 2 experiment, recovery and finalization scripts
        run: python -m compileall -q scripts/nano_t1/batch2
      - name: Verify exactly 27 unchanged scientific cell configs and 171 expected episodes
        run: python scripts/nano_t1/batch2/selftest.py
      - run: python -m pip install -r requirements.txt -r requirements-agents.txt
      - name: Run original frozen repository tests
        run: python reproduce.py --test
