name: Nano t1 static reproducibility checks
on:
  push:
    branches: [experiment/gpt54-nano-t1-none-new3]
    paths: [.github/workflows/nano-t1-selftest.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile experiment, monitor, and finalizer without executing API requests
        run: python -m compileall -q scripts/nano_t1/
      - name: Check 27 new conditions and 171 episodes match original six-seed scientific protocol
        run: python scripts/nano_t1/selftest.py
      - name: Run repository tests to detect protocol regressions
        run: |
          python -m pip install -r requirements.txt -r requirements-agents.txt
          python reproduce.py --test
